pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'me.champeau.includegit' version '0.3.2'
    id 'io.micronaut.build.shared.settings' version '8.0.1'
}

def localCore = providers.gradleProperty('local.git.micronaut-core')
    .orElse(providers.environmentVariable('LOCAL_GIT_MICRONAUT_CORE'))
def includeCore = providers.gradleProperty('includeMicronautCore')
    .orElse(providers.environmentVariable('INCLUDE_MICRONAUT_CORE'))
    .map { it.toBoolean() }
    .orElse(localCore.map { true })
    .getOrElse(false)

if (includeCore) {
    if (localCore.isPresent()) {
        includeBuild(file(localCore.get()))
    } else {
        gitRepositories {
            include('micronaut-core') {
                uri = 'https://github.com/micronaut-projects/micronaut-core.git'
                branch = providers.gradleProperty('micronautCoreBranch').orElse('core.scala').get()
            }
        }
    }
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'micronaut-scala-parent'

def scalaVersion = file('gradle/libs.versions.toml').text.find(/(?m)^scala3\s*=\s*"([^"]+)"/) { _, version -> version }
if (scalaVersion == null) {
    throw new GradleException("Could not determine the Scala version from gradle/libs.versions.toml")
}

include 'inject-scala'
include 'inject-scala-compiler'
include 'inject-scala-test'
include 'inject-scala-test-compiler'
include 'micronaut-scala-bom'

// Compiler-specific project names include the full Scala version because the
// compiler plugin API is not binary compatible across compiler releases.
// The physical directories remain stable as additional Scala versions are
// supported. Since the names are version-dependent, the compiler-specific
// projects intentionally do not use generated type-safe project accessors.
project(':inject-scala-compiler').name = "inject-scala-${scalaVersion}"
project(':inject-scala-test-compiler').name = "inject-scala-test-${scalaVersion}"

micronautBuild {
    useStandardizedProjectNames = true
}
