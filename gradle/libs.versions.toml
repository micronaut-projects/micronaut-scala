[versions]
asm = "9.10.1"
caffeine = "2.9.3"
scala3 = "3.9.0"
# The previous Scala 3 LTS. Published as a second compiler-plugin variant from the same
# sources; see the `scala-compiler-variant` convention plugin. Named to avoid nesting under
# `scala3`, which would turn `libs.versions.scala3` into a group accessor.
scalaLts = "3.3.8"
micronaut-core = "5.2.0-SNAPSHOT"

htmlsanitycheck = "1.1.6"
japicmp-gradle-plugin="0.4.6"
junit-platform="1.12.2"
micronaut-test = "5.1.0"
micronaut-validation = "5.1.0"
micronaut-serde = "3.1.1"
jackson = "3.1.6"
native-gradle-plugin = "0.11.4"
slf4j = "2.0.17"
spock = "2.4-groovy-5.0"
tomlj="1.1.1"
errorprone-gradle-plugin = "4.4.0"
nullaway = "0.13.8"
error_prone_core = "2.48.0"

#
# Versions which start with managed- are managed by Micronaut in the sense
# that they will appear in the Micronaut BOM as <properties>
#
# be sure to update graal version in gradle.properties as well
managed-graal = "25.0.3"
managed-groovy = "5.0.8"
sonatype-scan = "3.1.5"
micronaut-docs = "3.0.0"

[libraries]
test-boms-micronaut-validation = { module = "io.micronaut.validation:micronaut-validation-bom", version.ref = "micronaut-validation" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }

managed-graalvm-nativeimage = { module = "org.graalvm.sdk:nativeimage", version.ref = "managed-graal" }
managed-groovy = { module = "org.apache.groovy:groovy", version.ref = "managed-groovy" }

scala3-compiler = { module = "org.scala-lang:scala3-compiler_3", version.ref = "scala3" }
scala3-library = { module = "org.scala-lang:scala3-library_3", version.ref = "scala3" }
micronaut-core = { module = "io.micronaut:micronaut-core", version.ref = "micronaut-core" }
micronaut-core-processor = { module = "io.micronaut:micronaut-core-processor", version.ref = "micronaut-core" }
micronaut-context = { module = "io.micronaut:micronaut-context", version.ref = "micronaut-core" }
micronaut-retry = { module = "io.micronaut:micronaut-retry", version.ref = "micronaut-core" }
micronaut-http = { module = "io.micronaut:micronaut-http", version.ref = "micronaut-core" }
micronaut-json-core = { module = "io.micronaut:micronaut-json-core", version.ref = "micronaut-core" }
micronaut-jackson-core = { module = "io.micronaut:micronaut-jackson-core", version.ref = "micronaut-core" }

sonatype-scan = { module = "org.sonatype.gradle.plugins:scan-gradle-plugin", version.ref = "sonatype-scan" }

caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }

groovy-test-junit5 = { module = "org.apache.groovy:groovy-test-junit5", version.ref = "managed-groovy" }

htmlsanitycheck = { module = "org.aim42:htmlSanityCheck", version.ref = "htmlsanitycheck"}
japicmp-gradle-plugin = { module = "me.champeau.gradle:japicmp-gradle-plugin", version.ref = "japicmp-gradle-plugin"}

junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }

micronaut-docs = { module = "io.micronaut.docs:micronaut-docs-asciidoc-config-props", version.ref = "micronaut-docs" }
micronaut-test-core = { module = "io.micronaut.test:micronaut-test-core", version.ref = "micronaut-test" }
micronaut-test-junit5 = { module = "io.micronaut.test:micronaut-test-junit5", version.ref = "micronaut-test" }
micronaut-test-kotest5 = { module = "io.micronaut.test:micronaut-test-kotest5", version.ref = "micronaut-test" }
micronaut-test-spock = { module = "io.micronaut.test:micronaut-test-spock", version.ref = "micronaut-test" }

native-gradle-plugin = { module = "org.graalvm.buildtools.native:org.graalvm.buildtools.native.gradle.plugin", version.ref = "native-gradle-plugin"}

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

spock = { module = "org.spockframework:spock-core", version.ref = "spock" }

tomlj = { module = "org.tomlj:tomlj", version.ref="tomlj"}

micronaut-validation = { module = "io.micronaut.validation:micronaut-validation" }
test-boms-micronaut-serde = { module = "io.micronaut.serde:micronaut-serde-bom", version.ref = "micronaut-serde" }
micronaut-serde-jackson = { module = "io.micronaut.serde:micronaut-serde-jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
micronaut-validation-processor = { module = "io.micronaut.validation:micronaut-validation-processor" }

nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
error-prone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "error_prone_core" }

gradle-errorprone = { module = "net.ltgt.errorprone:net.ltgt.errorprone.gradle.plugin", version.ref = "errorprone-gradle-plugin"}
