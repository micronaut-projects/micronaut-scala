# One-time recovery for the release run 43175025595. Remove after recovery succeeds.
name: Recover v1.0.0-M1 Release

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: recover-release-v1.0.0-M1
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
    outputs:
      artifacts-sha256: ${{ steps.hash.outputs.artifacts-sha256 }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v1.0.0-M1
          token: ${{ secrets.GH_TOKEN }}
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Set release version
        id: release_version
        run: echo 'release_version=1.0.0-M1' >> "$GITHUB_OUTPUT"
      - name: Recreate publication files locally
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
          GPG_FILE: ${{ secrets.GPG_FILE }}
          DEVELOCITY_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
          DEVELOCITY_CACHE_USERNAME: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USERNAME }}
          DEVELOCITY_CACHE_PASSWORD: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}
        run: |
          echo "$GPG_FILE" | base64 -d > secring.gpg
          # Publish only to a local Maven repository. This deliberately does not call
          # publishToMavenCentral, so the already-published release is not submitted again.
          ./gradlew publishToMavenLocal -Dmaven.repo.local="$GITHUB_WORKSPACE/build/repo"
          for artifact in \
            micronaut-inject-scala-test_3.9.0 \
            micronaut-inject-scala_3.3.9 \
            micronaut-inject-scala_3.9.0 \
            micronaut-inject-scala_3.10.1 \
            micronaut-runtime-scala \
            micronaut-scala-bom; do
            pom="build/repo/io/micronaut/scala/${artifact}/1.0.0-M1/${artifact}-1.0.0-M1.pom"
            if [[ ! -f "$pom" ]]; then
              echo "Expected release POM is missing: $pom" >&2
              exit 1
            fi
          done
      - name: Generate subject
        id: hash
        run: |
          cd build/repo
          mapfile -d '' ARTIFACTS < <(find . -type f -printf '%P\0' | sort -z)
          if [[ ${#ARTIFACTS[@]} -eq 0 ]]; then
            echo "No publication artifacts found" >&2
            exit 1
          fi
          HASHES=$(sha256sum -- "${ARTIFACTS[@]}" | base64 -w0)
          cd ../..
          echo "artifacts-sha256=$HASHES" >> "$GITHUB_OUTPUT"
          echo -n "$HASHES" > artifacts-sha256
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-build-outputs
          path: build/repo
          retention-days: 5
      - name: Upload artifacts-sha256
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-sha256
          path: artifacts-sha256
          retention-days: 5
      - name: Generate docs
        run: ./gradlew docs
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
          DEVELOCITY_CACHE_USERNAME: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USERNAME }}
          DEVELOCITY_CACHE_PASSWORD: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}
          GH_TOKEN_PUBLIC_REPOS_READONLY: ${{ secrets.GH_TOKEN_PUBLIC_REPOS_READONLY }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
      - name: Export Gradle Properties
        uses: micronaut-projects/github-actions/export-gradle-properties@5f587657fc12601ab92d64d077f99a54c3cbdf78 # master
      - name: Publish docs to GitHub Pages
        uses: micronaut-projects/github-pages-deploy-action@76d63aafbab7108d74e83be4e5b3b0501382e829 # master
        env:
          BETA: true
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          BRANCH: gh-pages
          FOLDER: build/docs
          VERSION: ${{ steps.release_version.outputs.release_version }}
          TARGET_REPOSITORY: ${{ github.repository }}
          DEVELOCITY_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
          DEVELOCITY_CACHE_USERNAME: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USERNAME }}
          DEVELOCITY_CACHE_PASSWORD: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}
      - name: Run post-release
        uses: micronaut-projects/github-actions/post-release@5f587657fc12601ab92d64d077f99a54c3cbdf78 # master
        env:
          MICRONAUT_BUILD_EMAIL: ${{ secrets.MICRONAUT_BUILD_EMAIL }}
          RELEASE_VERSION: 1.0.0-M1
          TARGET_BRANCH: master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  provenance-subject:
    needs: [recovery]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      artifacts-sha256: ${{ steps.set-hash.outputs.artifacts-sha256 }}
    steps:
      - name: Download artifacts-sha256
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts-sha256
      - name: Set artifacts-sha256 as output
        id: set-hash
        shell: bash
        run: echo "artifacts-sha256=$(cat artifacts-sha256)" >> "$GITHUB_OUTPUT"

  provenance:
    needs: [recovery, provenance-subject]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: "${{ needs.provenance-subject.outputs.artifacts-sha256 }}"
      upload-assets: true
      upload-tag-name: v1.0.0-M1
      compile-generator: true

  github_release:
    needs: [recovery, provenance]
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v1.0.0-M1
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gradle-build-outputs
          path: build/repo
      - name: Create artifacts archive
        shell: bash
        run: |
          cd build/repo
          find . -type f -printf '%P\n' | sort | zip -q -@ ../../artifacts.zip
      - name: Upload assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v1.0.0-M1
          files: artifacts.zip
